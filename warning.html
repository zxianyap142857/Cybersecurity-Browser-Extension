<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Warning</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 560px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      color: #333;
    }

    .icon { font-size: 72px; margin-bottom: 16px; }

    .title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .confidence-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .description {
      font-size: 15px;
      line-height: 1.6;
      color: #555;
      margin-bottom: 16px;
    }

    .url-box {
      font-size: 13px;
      color: #888;
      word-break: break-all;
      padding: 10px 14px;
      background: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 32px;
      border: 1px solid #eee;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 36px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      min-width: 160px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }

    .btn-back { color: #fff; }
    .btn-proceed {
      background: transparent;
      color: #999;
      border: 2px solid #ccc;
    }
    .btn-proceed:hover { border-color: #999; color: #666; }

    .footer {
      font-size: 11px;
      color: #bbb;
      margin-top: 24px;
    }

    /* Phishing (>=85%) */
    .level-phishing .title { color: #dc3545; }
    .level-phishing .confidence-badge { background: #fde8ea; color: #dc3545; }
    .level-phishing .btn-back { background: #dc3545; }

    /* Suspicious (50-84%) */
    .level-suspicious .title { color: #e67e22; }
    .level-suspicious .confidence-badge { background: #fef3e6; color: #e67e22; }
    .level-suspicious .btn-back { background: #e67e22; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon" id="icon"></div>
    <h1 class="title" id="title"></h1>
    <span class="confidence-badge" id="confidence-badge"></span>
    <p class="description" id="description"></p>
    <div class="url-box" id="url-box"></div>
    <div class="actions">
      <button class="btn btn-back" id="go-back-btn"></button>
      <button class="btn btn-proceed" id="proceed-btn">Proceed Anyway</button>
    </div>
    <p class="footer">Detected by Cybersecurity Browser Extension</p>
  </div>

  <script src="scripts/warning.js"></script>
</body>
</html>
